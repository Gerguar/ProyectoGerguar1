name: mundial (Pinnacle + predict cada 6h)

# Refresca cuotas de Pinnacle del Mundial 2026 y re-genera pronosticos cada 6h.
#
# Hace:
# 1. Bajar cuotas H/D/A de la API guest de Pinnacle (sin auth).
# 2. Guardar data/wc2026_market_odds.json.
# 3. Re-correr predict_mundial.py que combina DC + Elo + Plantilla + Mercado
#    y upsertea filas en pronosticos (tabla Supabase).
# 4. Commit + push del JSON (si cambio).
#
# El frontend ya consume pronosticos automaticamente desde Supabase
# via loadMatches(), asi que no hace falta tocar HTML.

on:
  # ── CRON APAGADO el 23-ago-2026 ──────────────────────────────────────────
  # El Mundial 2026 termino el 19-jul (España 1-0 Argentina). Este workflow
  # seguia corriendo 4 veces por dia: re-predecia partidos que ya no existen y
  # bajaba cuotas de Pinnacle de un torneo terminado.
  #
  # Nada de lo que hacia queda sin cubrir:
  #   - "Actualizar Forma reciente" era REDUNDANTE: generate_insights.py ya
  #     llama a build_forma_reciente() en cada corrida, e insights.yml corre
  #     cada 6h — la misma frecuencia que tenia este cron.
  #   - el resto (ingest_wc2026, Pinnacle WC, lesiones del Mundial,
  #     predict_mundial) es especifico del Mundial 2026.
  #
  # Queda en workflow_dispatch para correrlo a mano. Para el proximo torneo,
  # descomentar el schedule.
  # schedule:
  #   - cron: "20 */6 * * *"  # Cada 6h, a los :20 (offset vs insights que corre :10)
  workflow_dispatch: {}

concurrency:
  group: git-push
  cancel-in-progress: false

jobs:
  mundial:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Sync fixture, horarios y resultados Mundial 2026
        # continue-on-error: si falla NO bloquea los steps siguientes
        # (Pinnacle/predict), pero el step queda marcado como FALLIDO en el run
        # (visible) — a diferencia del viejo "|| echo" que lo dejaba en verde y
        # ocultaba fallos persistentes (ej. FOOTBALL_DATA_TOKEN vencido).
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python -m src.ingest_wc2026

      - name: Actualizar Forma reciente de Insights
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m src.refresh_insights_forma

      - name: Refresh partidos selecciones 2025 (martj42 -> Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m src.ingest_partidos_selecciones_2025 || echo "[partidos-sel] fallo no critico"

      - name: Refresh Pinnacle WC odds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m src.ingest_pinnacle_wc --save

      - name: Integrar lesiones desde insights (Claude)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m src.integrate_lesiones_mundial || echo "[lesiones] fallo no critico"

      - name: Re-predict Mundial (DC + Elo + Plantilla + Mercado + Sede + Fase + Lesiones)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m src.predict_mundial

      - name: Commit cuotas + ajustes + Forma reciente (si cambian)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wc2026_market_odds.json data/wc2026_ajustes_lesiones.json web/data/insights.json || true
          if ! git diff --cached --quiet; then
            git stash
            git pull --rebase origin main
            git stash pop
            git add data/wc2026_market_odds.json data/wc2026_ajustes_lesiones.json web/data/insights.json || true
            git commit -m "chore: refresh Pinnacle WC odds + lesiones $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin main
          else
            echo "no changes"
          fi
