name: world-cup-squads (diario + manual)

on:
  # ── CRON APAGADO el 23-ago-2026 ──────────────────────────────────────────
  # Sincronizaba plantillas, reemplazos y bajas del Mundial 2026, que termino
  # el 19-jul. Corria todos los dias sin nada que sincronizar.
  #
  # Lo unico de aca que alimenta al modelo de LIGAS es
  # `python -m src.team_ratings` (fuerza de planteles -> features EA FC del
  # XGBoost), y eso tambien lo corre fbref-stats.yml los miercoles 08:00 UTC,
  # junto con player_ratings y team_xg. O sea que pasa de diario a semanal, que
  # post-Mundial alcanza: los ratings EA FC casi no se mueven.
  #
  # Queda en workflow_dispatch para correrlo a mano.
  # schedule:
  #   - cron: "40 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: git-push
  cancel-in-progress: false

jobs:
  squads:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sincronizar reemplazos y bajas confirmadas
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m src.sync_squads_mundial

      - name: Enriquecer jugadores nuevos con EA FC 26
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m src.enrich_jugadores_mundial

      - name: Recalcular fuerza de planteles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m src.team_ratings

      - name: Integrar bajas confirmadas al modelo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m src.integrate_lesiones_mundial

      - name: Recalcular pronosticos del Mundial
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m src.predict_mundial

      - name: Commit team_ratings si cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/team_ratings.json
          if ! git diff --cached --quiet; then
            git stash
            git pull --rebase origin main
            git stash pop
            git add data/team_ratings.json
            git commit -m "chore: refresh World Cup squads $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin main
          else
            echo "no changes"
          fi
