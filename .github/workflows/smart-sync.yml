name: smart-sync (resultados de ligas)

# Estrategia:
# - Cron cada 30 min.
# - Job 'check' (~15s, sin instalar deps Python): activa el sync si hay partidos
#   vencidos hace 120 min.
#   (23-ago-2026: se sacaron los dos contadores del Mundial —partidos desde el
#   kickoff y en curso—; con el torneo terminado daban 0 siempre.)
# - Job 'sync' (~3 min): solo corre si 'check' encontro candidatos. Hace
#   data_ingest + supabase_sync para refrescar el parquet y propagar los
#   FINISHED a Supabase.
# - Si en este intento football-data.org aun no marco FINISHED (caso comun
#   con batches de La Liga), el siguiente cron en 30 min vuelve a intentar.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: git-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      needs_sync: ${{ steps.check.outputs.needs_sync }}
      pending_count: ${{ steps.check.outputs.pending_count }}
    steps:
      - id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d "-120 minutes" +%Y-%m-%dT%H:%M:%S)
          URL_OVERDUE="${SUPABASE_URL}/rest/v1/partidos?select=id&estado=eq.programado&fecha=lt.${CUTOFF}"

          count_url() {
            curl -sI "$1" \
                          -H "apikey: $SUPABASE_SERVICE_KEY" \
                          -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
                          -H "Prefer: count=exact" \
                          -H "Range: 0-0" \
              | awk 'tolower($0) ~ /^content-range:/ {split($0, parts, "/"); gsub("\r", "", parts[2]); print parts[2]}'
          }

          OVERDUE=$(count_url "$URL_OVERDUE")
          OVERDUE=${OVERDUE:-0}
          COUNT=$OVERDUE

          echo "Vencidos +120m: $OVERDUE"
          if [ "$COUNT" -gt 0 ]; then
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
            echo "pending_count=$COUNT" >> "$GITHUB_OUTPUT"
          else
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            echo "pending_count=0" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: check
    if: needs.check.outputs.needs_sync == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ingest fixtures + resultados frescos (football-data.org)
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python -m src.data_ingest --days-ahead 14 --skip-couk

      - name: Sync a Supabase (crea/actualiza partidos + cierra finalizados)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m src.supabase_sync --horizon 14

      - name: Ingest stats de partidos recien finalizados (API-Football)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m src.ingest_match_stats || echo "[stats] fallo no critico, sigue el sync"

      # ── STEPS DEL MUNDIAL 2026, DESACTIVADOS el 23-ago-2026 ─────────────────
      # El torneo termino el 19-jul. Estos cuatro steps corrian cada 30 min (48
      # veces por dia) sobre datos que ya no se mueven. Se dejan comentados en
      # vez de borrarlos: para el proximo Mundial alcanza con descomentarlos.
      #
      #   - ingest_wc2026 / integrate_lesiones_mundial / predict_mundial:
      #     especificos del Mundial, no hay partidos que sincronizar ni predecir.
      #   - refresh_insights_forma: ademas era REDUNDANTE — generate_insights ya
      #     llama a build_forma_reciente() en cada corrida e insights.yml corre
      #     cada 6h.
      #
      # `ingest_elo_selecciones` NO se elimino: se MOVIO a selecciones.yml
      # (lunes 04:00), porque era el unico lugar del repo donde corria y alimenta
      # el ranking Elo de selecciones que se ve en el home. Cada 30 min era
      # absurdo para un dato que cambia en las fechas FIFA.
      #
      # - name: Sync fixture Mundial 2026 (selecciones FIFA, liga_id=7)
      #   continue-on-error: true
      #   env:
      #     SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      #     SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      #     FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      #   run: python -m src.ingest_wc2026
      #
      # - name: Actualizar Forma reciente de Insights
      #   env:
      #     SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      #     SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      #   run: python -m src.refresh_insights_forma
      #
      # - name: Integrar lesiones desde insights (Claude)
      #   env:
      #     SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      #     SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      #   run: python -m src.integrate_lesiones_mundial || echo "[lesiones] fallo no critico"
      #
      # - name: Re-predict Mundial (despues de updates de partidos + Elo + Lesiones)
      #   env:
      #     SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      #     SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      #   run: python -m src.predict_mundial || echo "[predict-mundial] fallo no critico"

      - name: Commit resultados (si hubo cambios)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches.parquet || true
          if ! git diff --cached --quiet; then
            git stash
            git pull --rebase origin main
            git stash pop
            git add data/matches.parquet || true
            git commit -m "chore: smart-sync $(date -u +%Y-%m-%dT%H:%M:%SZ) (${{ needs.check.outputs.pending_count }} pendientes)"
            git push origin main
          else
            echo "no changes"
          fi

      - name: Resumen
        run: |
          echo "Pendientes detectados antes del sync: ${{ needs.check.outputs.pending_count }}"
          echo "(Si quedan en 'programado' tras este sync, football-data.org todavia"
          echo " no marco FINISHED. Proximo intento en 30 min.)"
