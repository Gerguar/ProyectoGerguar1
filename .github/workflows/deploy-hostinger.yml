name: deploy-hostinger

# Auto-deploy de web/ a Hostinger via SFTP (puerto 65002 sobre SSH).
#
# Migrado de FTP21 -> SFTP el 19-jun-2026: FTP21 estaba intermitente, SFTP
# es mas confiable. El autodeploy nativo de Hostinger se desactivo despues
# del rename del repo (FUTVS -> ProyectoGerguar1), asi que mantenemos este
# workflow + cron-job.org cada hora.
#
# Se dispara cuando:
#  - Push a main que toque archivos en web/
#  - Manual (workflow_dispatch) -- usado por cron-job.org cada hora

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hostinger-sftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Instalar lftp
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Sincronizar web/ con la app activa de Hostinger via SFTP
        env:
          SFTP_HOST: 62.72.62.156
          SFTP_PORT: 65002
          SFTP_USERNAME: u703341534
          SFTP_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        timeout-minutes: 6
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Intento SFTP ${attempt}/3"
            if timeout 120 lftp \
              -u "${SFTP_USERNAME},${SFTP_PASSWORD}" \
              -p "${SFTP_PORT}" \
              "sftp://${SFTP_HOST}" \
              -e "
                set sftp:auto-confirm yes;
                set net:timeout 25;
                set net:max-retries 2;
                set net:reconnect-interval-base 3;
                set cmd:fail-exit yes;
                mirror --reverse --only-newer --verbose --parallel=2 \
                  --exclude-glob .git* \
                  --exclude-glob node_modules/ \
                  --exclude-glob .DS_Store \
                  ./web/ domains/futversus.com/nodejs/;
                bye
              "; then
              echo "Sincronizacion SFTP completada."
              exit 0
            fi

            echo "Intento ${attempt} fallo."
            if [[ "${attempt}" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done

          echo "La sincronizacion SFTP fallo despues de tres intentos."
          exit 1

      - name: Resumen
        run: |
          echo "Deploy completado a https://futversus.com/"
          echo "Archivos en web/ subidos a ~/domains/futversus.com/nodejs/."
